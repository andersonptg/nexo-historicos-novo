# NEXO_BRANCO_V11_UNIFICADO
name: Publicar NEXO HISTORICOS NOVO V1
on:
  workflow_dispatch:
  push:
    branches:
      - nexo-v7-1-fortune-double-20261121
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar coletor
        run: python nexo.py testar
      - name: Instalar ferramentas Cloudflare
        run: npm install --no-audit --no-fund
      - name: Testar API Worker
        run: npm test
      - name: Publicar SOMENTE o Worker NOVO
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
